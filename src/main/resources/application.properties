spring.application.name=api-finacas
server.port=${PORT:8080}
# JWT (placeholders para produção)
jwt.secret=${JWT_SECRET:chave-temporaria-para-dev}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Banco de dados (fallback para H2 quando DATABASE_URL não está definido)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA (configurações comuns)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialeto H2 (apenas necessário quando H2 está ativo; PostgreSQL detecta automaticamente)
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
# Console H2 (ativo apenas quando H2 está em uso)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

